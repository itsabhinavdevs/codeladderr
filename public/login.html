<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — DSA Tracker</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/themes/dark.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .login-card img {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    .login-card h1 {
      font-size: 1.25rem;
      margin-bottom: 1.75rem;
    }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.7rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .google-btn:hover {
      border-color: var(--color-text-secondary);
    }

    .google-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-loading {
      color: var(--color-text-secondary);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <p id="login-loading" class="login-loading">Loading…</p>

    <div id="login-card" class="login-card" hidden>
      <img src="/public/assets/logos/logo.jpg" alt="DSA Tracker logo" />
      <h1>DSA Tracker</h1>
      <button id="google-signin-btn" class="google-btn" type="button">
        Continue with Google
      </button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
