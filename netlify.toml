# No build step required. This site is published straight from the repo root so that
# root-absolute imports like "/src/main.js" resolve as written in the HTML/JS.
# public/ holds the two real HTML entry points plus static assets; the redirects
# below map the clean URLs the app already uses ("/", "/login.html", "/assets/*")
# onto their real location inside public/.
[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/public/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/public/index.html"
  status = 200

[[redirects]]
  from = "/login.html"
  to = "/public/login.html"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/public/assets/:splat"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/public/robots.txt"
  status = 200

# --- Block non-public repo files from being served ---
# publish = "." exposes the whole repo by default. src/ has to stay public
# (the browser fetches it directly as ES modules), but nothing below does.
[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true
